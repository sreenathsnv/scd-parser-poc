# core profile (always-on) + local-llm profile (Ollama). simulator profile added in Phase 3.
services:
  frontend:
    build: ./services/frontend
    depends_on:
      - api-gateway
    networks: [scd-net]

  api-gateway:
    build: ./services/api-gateway
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      SCD_FILES_DIR: /data/scl-files
      VALIDATION_SIDECAR_URL: http://validation-sidecar:8080
      MODEL_GENERATOR_URL: http://model-generator:8080
    volumes:
      - ${SCD_FILES_HOST_DIR:-./Resources}:/data/scl-files
    depends_on:
      - neo4j
      - validation-sidecar
    networks: [scd-net]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    volumes:
      - neo4j_data:/data
    networks: [scd-net]

  validation-sidecar:
    build: ./services/validation-sidecar
    networks: [scd-net]

  model-generator:
    build: ./services/model-generator
    networks: [scd-net]

  llm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-master-key}
    volumes:
      - ./services/llm-proxy/config.yaml:/app/config.yaml:ro
    networks: [scd-net]

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./services/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - api-gateway
    networks: [scd-net]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    networks: [scd-net]

networks:
  scd-net:

volumes:
  neo4j_data:
  ollama_data:
