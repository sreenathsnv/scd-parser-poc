# dev-only overrides: bind-mounted source + hot reload (auto-loaded with docker-compose.yml)
services:
  api-gateway:
    volumes:
      - ./services/api-gateway/app:/app/app
      - ${SCD_FILES_HOST_DIR:-./Resources}:/data/scl-files
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./services/frontend
      target: build
    # port 80 to match reverse-proxy's upstream. No host port published here on
    # purpose: this container has no /api proxy, so direct access breaks every
    # API call. Always use reverse-proxy at http://localhost:8080.
    command: ["npm", "run", "dev", "--", "--host", "--port", "80"]
    volumes:
      - ./services/frontend/src:/app/src
      - ./services/frontend/index.html:/app/index.html
